<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ООО «ООО» — Операционная панель</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;color-scheme:dark;--bg:#0d1117;--panel:#161b22;--line:#30363d;--text:#e6edf3;--muted:#b1bac4;--good:#3fb950;--warn:#d29922;--bad:#f85149;--info:#58a6ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);min-height:100vh}.wrap{max-width:980px;margin:0 auto;padding:20px 16px 36px}
header{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;margin-bottom:18px}h1{font-size:24px;margin:0 0 4px}.sub,.caption{color:var(--muted);font-size:13px}
button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.mini{padding:6px 9px;font-size:12px}.disabled{opacity:.55}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#21262d;border:1px solid var(--line);padding:10px 14px;border-radius:10px;font-size:13px;z-index:20;max-width:90vw}.schedule-main{min-width:0;flex:1}.schedule-title{font-weight:600;word-break:break-word}
.banner{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px 16px;margin-bottom:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}.banner strong{font-size:17px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px}.good{background:var(--good)}.warn{background:var(--warn)}.bad{background:var(--bad)}.info{background:var(--info)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px}.card h2{font-size:15px;margin:0 0 10px;color:var(--muted);font-weight:600}
.big{font-size:21px;font-weight:700;margin:2px 0 8px}.meta{font-size:13px;color:var(--muted);line-height:1.5}.reason{margin-top:3px;color:var(--text);font-size:13px;line-height:1.4}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.stat{border:1px solid var(--line);border-radius:10px;padding:9px;text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}
.section{margin-top:14px}.section h2{font-size:15px;margin:0 0 8px;color:var(--muted)}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid var(--line);background:var(--panel);border-radius:10px;margin-bottom:7px;font-size:13px}.state{font-weight:700}
footer{margin-top:16px;color:var(--muted);font-size:12px;text-align:center}@media(max-width:640px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}h1{font-size:21px}.wrap{padding-top:14px}.banner{align-items:flex-start}}
.stage{overflow-wrap:anywhere}.card{min-width:0}.reason,.meta{overflow-wrap:anywhere}@media(max-width:640px){.row{flex-wrap:wrap}.actions{justify-content:flex-start}}
.role-stack{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}.role-card{padding:10px 14px}.role-card h2{margin:0 0 4px}.role-status{font-size:16px;font-weight:600;line-height:1.35}.one-line{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;line-height:1.5}.role-detail summary{cursor:pointer;font-size:12px;color:var(--info);padding:4px 0;min-height:28px}.role-detail[open]{margin-top:6px}.role-detail pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;color:var(--muted)}summary:focus-visible{outline:2px solid var(--info);outline-offset:2px}@media(max-width:640px){.role-card{padding:9px 12px}.role-detail summary{min-height:32px}}
</style>
</head>
<body>
<div class="wrap">
<header><div><h1>ООО «ООО»</h1><div class="sub">Операционная панель состояния</div></div><button id="refresh">Обновить</button></header>
<div id="app"><div class="banner"><strong>Загрузка…</strong></div></div>
<footer>Автообновление каждые 10 секунд · управление расписаниями защищено PIN · без содержимого писем и документов</footer>
</div>
<script>
var RU={HEALTHY:"Норма",ACTIVE:"Активно",ATTENTION:"Требует внимания",DEGRADED:"Ограниченная работа",DEGRADED_LOCAL:"Локальный контур недоступен",RUNNING:"В работе",WORKING:"В работе",IDLE_READY:"Готов к работе",ONLINE_IDLE:"Готов к работе",TECHNICAL_BLOCKED:"Техническая пауза",BLOCKED:"Приостановлено",RECOVERING:"Восстановление",WAITING_USER:"Ждёт Василия",WAITING_LOCAL_DEPENDENCY:"Ждёт компьютер",FAILED:"Ошибка",UNCERTAIN:"Нужна сверка",DONE:"Завершено"};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;","\\\"":"&quot;","'":"&#39;"}[m]})}
function fmt(t){return t?new Intl.DateTimeFormat("ru-RU",{timeZone:"Asia/Jerusalem",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"}).format(new Date(t)):"—"}
function cls(code){
 if(["HEALTHY","ONLINE_IDLE","IDLE_READY","ACTIVE","DONE"].indexOf(code)>=0)return"good";
 if(["FAILED","ERROR","EXPIRED","OFFLINE","ATTENTION"].indexOf(code)>=0)return"bad";
 if(["WAITING_USER","WAITING_LOCAL","WAITING_LOCAL_DEPENDENCY","RENEW_DUE","NOT_CONFIGURED","TECHNICAL_BLOCKED","BLOCKED","RECOVERING"].indexOf(code)>=0)return"warn";
 return"info";
}
function progressText(p){return p && Number.isFinite(p.percent)?p.percent+'% · закрыто '+p.closed_weight+' из '+p.total_weight:'не рассчитан';}

function cleanText(v,fallback){var s=String(v||'').replace(/\s+/g,' ').trim();if(!s)return fallback;var q=(s.match(/\?/g)||[]).length;if(q>=3&&q/Math.max(1,s.length)>.18)return fallback;if(/^[A-Za-z]:[\\/]|^\/.*\//.test(s))return fallback;return s;}
function shortLine(v,fallback){var s=cleanText(v,fallback);return s.length>86?s.slice(0,83)+'…':s;}
function humanStatus(title,x){if(x.divergence_detected||x.code==='UNCERTAIN')return 'Нужна сверка статуса.';if(x.stale)return 'Данные устарели.';var a=x.availability||x.code;if(a==='TECHNICAL_BLOCKED'||(x.task_state==='BLOCKED'&&!x.needs_user))return 'Техническая пауза. Василий не нужен.';if(a==='IDLE_READY'||a==='ONLINE_IDLE')return title==='Толик'?'Свободен и готов к задаче.':'Свободна и готова к задаче.';var states={OFFLINE:'Нет актуального пульса.',UNKNOWN:'Статус пока неизвестен.',WORKING:'Идёт работа.',RUNNING:'Идёт работа.',WAITING_USER:'Требуется решение Василия.',NEEDS_USER:'Требуется решение Василия.',RECOVERING:'Идёт восстановление.',BLOCKED:'Работа приостановлена.',QUEUED:'Задача ожидает запуска.'};if(a==='OFFLINE'||a==='UNKNOWN')return states[a];if(x.task_state==='DONE'||x.code==='DONE')return 'Работа завершена.';return states[a]||RU[a]||cleanText(x.label,'Статус пока неизвестен.');}
function nextAction(title,x,w){var a=x.availability||x.code;if(a==='TECHNICAL_BLOCKED'&&!x.needs_user)return 'автовосстановление и продолжение с сохранённого состояния';if((a==='IDLE_READY'||a==='ONLINE_IDLE')&&title==='Толик')return 'взять следующую разрешённую задачу';if(x.task_state==='DONE')return 'принять результат и синхронизировать';if(a==='OFFLINE')return 'проверить актуальность пульса';return shortLine(w.next_stage,'следующий этап не указан');}
function agentCard(title,x,extra){
 x=x||{};var w=x.work||{}, id=title==='Клавдия'?'klavdia':'tolik';
 var task=shortLine(w.current_stage||w.unit_title,id==='klavdia'?'Архитектурная / менеджерная задача':'Нет активной локальной задачи');
 var next=nextAction(title,x,w);
 var p=w.progress, progress='';
 if(p&&Number.isFinite(p.percent)&&p.total_weight>0)progress='<div class="caption">Прогресс: '+esc(progressText(p))+'</div>';
 else if(w.current_stage)progress='<div class="caption">Этап: '+esc(shortLine(w.current_stage,'идёт работа'))+'</div>';
 else if(x.checkpoint_at)progress='<div class="caption">Есть контрольная точка</div>';
 else if((x.availability||x.code)==='WORKING')progress='<div class="caption">Прогресс: идёт работа</div>';
 var diagnostics={availability:x.availability,task_state:x.task_state,stale:x.stale,divergence_detected:x.divergence_detected,checkpoint_at:x.checkpoint_at,progress_at:x.progress_at,source:x.source,signals:x.signals,last_transition:x.last_transition};
 return '<article class="card role-card" data-role="'+id+'"><h2>'+esc(title)+' <span class="caption">· '+(id==='klavdia'?'Руководитель':'Технический исполнитель')+'</span></h2><div class="role-status"><span class="dot '+cls(x.code)+'"></span>'+esc(humanStatus(title,x))+'</div><div class="one-line">'+esc(task)+'</div><div class="one-line caption">Дальше: '+esc(next)+'</div>'+progress+'<details id="detail-'+id+'" class="role-detail"><summary>Подробнее</summary><div class="meta">Статус источника: '+esc(x.code)+'<br>Задача: '+esc(w.unit_title||'не указана')+'<br>Этап: '+esc(w.current_stage||'не указан')+'<br>Дальше: '+esc(w.next_stage||'не указан')+'<br>'+extra+'<br>Собственный прогресс: '+esc(progressText(w.own_progress))+'</div><pre>'+esc(JSON.stringify(diagnostics,null,2))+'</pre></details></article>';
}
function receptionCard(){return '<article class="card role-card" data-role="lenochka"><h2>Леночка <span class="caption">· Приёмная и координатор</span></h2><div class="role-status"><span class="dot info"></span>Координация и приёмка</div><div class="one-line">Маршрутизация задач и контроль результата</div><div class="one-line caption">Дальше: реагировать на подтверждённые события команды</div><details id="detail-lenochka" class="role-detail"><summary>Подробнее</summary><div class="meta">Отдельного canonical heartbeat/progress источника Леночки пока нет. Поэтому Dashboard показывает только подтверждённую роль координации и не придумывает машинный процент или heartbeat.</div></details></article>';}

const ACTION_URL="https://fqznrqxucpyqyxgfrvda.supabase.co/functions/v1/ooo-dashboard-action";
function toast(msg){
  var old=document.getElementById("toast"); if(old) old.remove();
  var x=document.createElement("div"); x.id="toast"; x.className="toast"; x.textContent=msg;
  document.body.appendChild(x); setTimeout(function(){x.remove()},2600);
}
function getPin(){
  var p=localStorage.getItem("oooDashboardPin")||"";
  if(/^\d{8}$/.test(p)) return p;
  p=prompt("Введите 8-значный PIN управления расписаниями:")||"";
  if(!/^\d{8}$/.test(p)){toast("Нужен 8-значный PIN");return "";}
  localStorage.setItem("oooDashboardPin",p); return p;
}
async function action(name,payload){
  var pin=getPin(); if(!pin) return false;
  var r=await fetch(ACTION_URL,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(Object.assign({pin:pin,action:name},payload||{}))});
  var d={}; try{d=await r.json()}catch{}
  if(r.status===401){localStorage.removeItem("oooDashboardPin");toast("Неверный PIN. Введите его заново.");return false;}
  if(!r.ok){toast("Команда не выполнена: "+(d.error||("HTTP "+r.status)));return false;}
  toast("Готово"); await load(); return true;
}
function localInputDefault(iso){
  var d=iso?new Date(iso):new Date(Date.now()+3600000);
  var z=new Date(d.getTime()-d.getTimezoneOffset()*60000);
  return z.toISOString().slice(0,16);
}
async function rescheduleOne(id,iso){
  var v=prompt("Новая дата и время (ГГГГ-ММ-ДДTЧЧ:ММ):",localInputDefault(iso));
  if(!v)return;
  var d=new Date(v);
  if(isNaN(d.getTime())){toast("Неверная дата");return;}
  await action("ONE_TIME_RESCHEDULE",{task_id:id,new_time:d.toISOString()});
}
async function deferRecurring(id,iso){
  var v=prompt("Когда выполнить ближайший запуск?",localInputDefault(iso));
  if(!v)return;
  var d=new Date(v);
  if(isNaN(d.getTime())){toast("Неверная дата");return;}
  await action("RECURRING_DEFER_NEXT",{schedule_id:id,new_time:d.toISOString()});
}
async function toggleRecurring(id,enabled){
  await action(enabled?"RECURRING_DISABLE":"RECURRING_ENABLE",{schedule_id:id});
}
async function editRecurringRule(id,kind,localTime,weekdays,priority){
  var hhmm=String(localTime||"").slice(0,5);
  var t=prompt("Время серии (ЧЧ:ММ):",hhmm||"10:00");
  if(!t)return;
  if(!/^([01]\\d|2[0-3]):[0-5]\\d$/.test(t)){toast("Неверное время");return;}
  var days=null;
  if(kind==="WEEKLY_DAYS"){
    var current=Array.isArray(weekdays)?weekdays.join(","):"1";
    var raw=prompt("Дни недели через запятую: 1=Пн ... 7=Вс",current);
    if(raw===null)return;
    days=raw.split(",").map(function(x){return Number(x.trim())}).filter(function(x){return Number.isInteger(x)});
    if(!days.length||days.some(function(x){return x<1||x>7})){toast("Дни должны быть от 1 до 7");return;}
    days=Array.from(new Set(days)).sort();
  }
  var p=prompt("Приоритет P0–P3:",priority||"P2")||"";
  p=p.toUpperCase();
  if(["P0","P1","P2","P3"].indexOf(p)<0){toast("Приоритет только P0–P3");return;}
  await action("RECURRING_UPDATE_RULE",{schedule_id:id,local_time:t+":00",weekdays:days,priority:p});
}
async function load(){
 try{
  var r=await fetch("https://fqznrqxucpyqyxgfrvda.supabase.co/functions/v1/ooo-dashboard?json=1",{cache:"no-store"});
  if(!r.ok)throw new Error("HTTP "+r.status);
  var d=await r.json();
  var recent=(d.recent||[]).map(function(x){
    return '<div class="row"><span>'+esc(x.source)+' · '+esc(x.stage||"процесс")+'</span><span class="state">'+esc(RU[x.state]||x.state)+' · '+fmt(x.time)+'</span></div>';
  }).join("");
  if(!recent)recent='<div class="row"><span>Событий пока нет</span></div>';
  var s=d.schedule||{one_time:[],recurring:[]};
  var planned=(s.one_time||[]).map(function(x){
    return '<div class="row"><div class="schedule-main"><div class="schedule-title">'+esc(x.title||"Разовая задача")+'</div><div class="caption">разово · '+fmt(x.scheduled_for)+'</div></div><div class="actions"><button class="mini" onclick="rescheduleOne(\''+esc(x.task_id)+'\',\''+esc(x.scheduled_for)+'\')">Перенести</button></div></div>';
  }).concat((s.recurring||[]).map(function(x){
    var kind=x.schedule_kind==="DAILY"?"ежедневно":"по дням недели";
    var off=x.enabled?"":" disabled";
    var status=x.enabled?"включено":"выключено";
    var days=Array.isArray(x.weekdays)?x.weekdays:[];
    return '<div class="row'+off+'"><div class="schedule-main"><div class="schedule-title">'+esc(x.title||"Повторяющаяся задача")+'</div><div class="caption">'+esc(kind)+' · '+esc(status)+' · '+esc(String(x.local_time||"").slice(0,5))+' · '+esc(x.priority||"P2")+' · следующий: '+fmt(x.next_run_at)+'</div></div><div class="actions"><button class="mini" onclick="toggleRecurring(\''+esc(x.schedule_id)+'\','+(x.enabled?"true":"false")+')">'+(x.enabled?"Выключить":"Включить")+'</button><button class="mini" onclick="editRecurringRule(\''+esc(x.schedule_id)+'\',\''+esc(x.schedule_kind)+'\',\''+esc(x.local_time||"")+'\','+JSON.stringify(days)+',\''+esc(x.priority||"P2")+'\')">Изменить серию</button>'+(x.enabled?'<button class="mini" onclick="deferRecurring(\''+esc(x.schedule_id)+'\',\''+esc(x.next_run_at)+'\')">Перенести следующий</button>':'')+'</div></div>';
  })).join("");
  if(!planned)planned='<div class="row"><span>Запланированных задач нет</span></div>';
  var html='';
  html+='<div class="banner"><div><div class="caption">Статус системы</div><strong><span class="dot '+cls(d.overall.code)+'"></span>'+esc(RU[d.overall.code]||cleanText(d.overall.label,'Статус системы'))+'</strong><div class="reason">'+esc(d.overall.code==='UNCERTAIN'?'Есть расхождение источников — система не угадывает статус.':cleanText(d.overall.detail,''))+'</div><div class="meta">Обновлено: '+fmt(d.generated_at)+'</div></div><div class="meta">Решений Василия: <b>'+d.overall.user_actions+'</b></div></div>';
  html+='<details id="integrity-detail"><summary class="caption">Сверка источников: '+esc((d.integrity||{}).status||'неизвестно')+((d.integrity||{}).divergence_detected?' · расхождение':'')+'</summary><pre class="meta">'+esc(JSON.stringify(d.integrity||{},null,2))+'</pre></details>';
  html+='<section class="role-stack" aria-label="Команда">';
  html+=agentCard("Клавдия",d.klavdia,'Последняя активность: '+fmt(d.klavdia.last_activity_at));
  html+=receptionCard();
  html+=agentCard("Толик",d.tolik,'ПК: '+esc(d.tolik.computer||"—")+'<br>Пульс: '+fmt(d.tolik.last_heartbeat_at)+'<br>Активных локальных задач: '+d.tolik.active_handoffs);
  html+='</section><div class="grid">';
  html+='<div class="card"><h2>Задачи</h2><div class="big">'+d.tasks.open_total+' открыто</div>';
  html+='<div class="stats"><div class="stat"><b>'+d.tasks.running+'</b><span>в работе</span></div><div class="stat"><b>'+d.tasks.waiting_user+'</b><span>ждут Василия</span></div><div class="stat"><b>'+d.tasks.waiting_local+'</b><span>ждут ПК</span></div></div>';
  html+='<div class="stats"><div class="stat"><b>'+d.tasks.failed+'</b><span>ошибки</span></div><div class="stat"><b>'+d.tasks.uncertain+'</b><span>сверка</span></div><div class="stat"><b>'+d.tasks.done_24h+'</b><span>готово 24ч</span></div></div></div>';
  html+='<div class="card"><h2>Gmail</h2><div class="caption">Статус</div><div class="big"><span class="dot '+cls(d.gmail.watch_code)+'"></span>'+esc(RU[d.gmail.watch_code]||cleanText(d.gmail.watch_label,'Статус почтового наблюдения'))+'</div><div class="meta">Последний push: '+fmt(d.gmail.last_push_at)+'<br>Последнее продление: '+fmt(d.gmail.last_renewed_at)+'<br>Срок подписки: '+fmt(d.gmail.expiration_at)+'</div></div>';
  html+='</div><div class="section"><h2>Запланировано</h2>'+planned+'</div><div class="section"><h2>Последние процессы</h2>'+recent+'</div>';
  var opened=['klavdia','lenochka','tolik'].filter(function(id){var el=document.getElementById('detail-'+id);return el&&el.open;});
  document.getElementById("app").innerHTML=html;
  opened.forEach(function(id){var el=document.getElementById('detail-'+id);if(el)el.open=true;});
 }catch(e){
  document.getElementById("app").innerHTML='<div class="banner"><strong><span class="dot bad"></span>Не удалось получить состояние</strong><div class="meta">'+esc(e.message)+'</div></div>';
 }
}
document.getElementById("refresh").onclick=load;
load();setInterval(load,10000);
</script>
</body>
</html>
